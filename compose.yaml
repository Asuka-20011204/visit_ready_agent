services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
    image: visit-ready-agent:${APP_VERSION:-dev}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8097}:8080"
    environment:
      APP_ADDR: ":8080"
      APP_MODE: ${APP_MODE:-demo}
      AUTH_MODE: ${AUTH_MODE:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      BOCHA_ENDPOINT: ${BOCHA_ENDPOINT:-https://api.bochaai.com/v1/web-search}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      SESSION_STORE: ${SESSION_STORE:-memory}
      MYSQL_DSN: ${MYSQL_DSN:-}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      SESSION_TTL: ${SESSION_TTL:-24h}
      SESSION_CLEANUP_INTERVAL: ${SESSION_CLEANUP_INTERVAL:-1m}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-25s}
      # Public deployments must not inherit a longer timeout from the host.
      WORKFLOW_TIMEOUT: 45s
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-2m}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-2m}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 130s
