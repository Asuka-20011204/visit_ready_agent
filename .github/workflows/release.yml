name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - id: version
        name: Validate release version
        shell: bash
        run: |
          value="${GITHUB_REF_NAME#v}"
          if ! [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.0.1." >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/visit-ready-agent" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify service quality gate
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          shellcheck scripts/*.sh scripts/tests/*.sh
          bash -n scripts/*.sh scripts/tests/*.sh
          bash scripts/tests/bootstrap-server-test.sh
          pwsh -File scripts/tests/deployment-windows-test.ps1
          go mod verify
          go vet ./...
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total < 80) exit 1 }'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify browser journeys
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record published digest
        shell: bash
        run: |
          echo "Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-dockerhub:
    if: vars.DOCKERHUB_PUBLISH_ENABLED == 'true'
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - id: dockerhub
        name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo 'Set DOCKERHUB_PUBLISH_ENABLED=true and configure DOCKERHUB_USERNAME/DOCKERHUB_TOKEN.' >&2
            exit 1
          fi
          echo "image=docker.io/${DOCKERHUB_USERNAME,,}/visit-ready-agent" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker Hub image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.dockerhub.outputs.image }}:${{ needs.prepare.outputs.version }}
            ${{ steps.dockerhub.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record published digest
        shell: bash
        run: |
          echo "Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
