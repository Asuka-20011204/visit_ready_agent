# 示例文件，不要提交真实密钥，也不要直接部署占位值。
apiVersion: v1
kind: Secret
metadata:
  name: visit-ready-secrets
  namespace: visit-ready
  labels:
    app.kubernetes.io/name: visit-ready-agent
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_WITH_LLM_API_KEY"
  BOCHA_API_KEY: "REPLACE_WITH_BOCHA_API_KEY_OR_LEAVE_EMPTY"
  MYSQL_DSN: "visitready:REPLACE_PASSWORD@tcp(mysql.internal:3306)/visitready?parseTime=true&charset=utf8mb4&loc=UTC"
  SESSION_ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_BASE64URL_KEY"
